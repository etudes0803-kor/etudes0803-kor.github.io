<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Brief — Chordy Studio</title>
<meta name="description" content="PR Brief 는 2026년 11월 운영을 마쳤습니다.">
<link rel="canonical" href="https://etudes0803-kor.github.io/prbrief.html">
<meta property="og:type" content="article">
<meta property="og:title" content="PR Brief — Chordy Studio">
<meta property="og:description" content="PR Brief 는 2026년 11월 운영을 마쳤습니다.">
<meta property="og:url" content="https://etudes0803-kor.github.io/prbrief.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎹</text></svg>">
<style>
  /* index.html 과 같은 토큰 계열. 이 사이트는 빌드 단계가 없어서 페이지마다
     자기 스타일을 들고 다닌다 — 값을 바꾸면 두 파일을 함께 고쳐야 한다. */
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --line: #e4e4e2;
    --line-strong: #d2d2cf;
    --ink: #18181b;
    --ink-2: #52525b;
    --ink-3: #6b6b68;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #e6f2f0;
    --radius: 10px;
    --maxw: 1000px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e11;
      --surface: #14161a;
      --line: #24272d;
      --line-strong: #333740;
      --ink: #f2f3f5;
      --ink-2: #a8adb6;
      --ink-3: #7c828c;
      --accent: #4db6a8;
      --accent-ink: #0d0e11;
      --accent-soft: #16302c;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  header.nav {
    position: sticky; top: 0; z-index: 40;
    height: 64px; display: flex; align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .nav-in { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 100%; }
  .brand { font-weight: 650; letter-spacing: -0.02em; font-size: 17px; text-decoration: none; color: var(--ink); }
  .brand b { color: var(--accent); font-weight: 650; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { color: var(--ink-2); text-decoration: none; font-size: 14.5px; white-space: nowrap; }
  .nav-links a:hover { color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  section { padding: 64px 0; border-top: 1px solid var(--line); }
  h1, h2, h3 { letter-spacing: -0.025em; line-height: 1.18; margin: 0; }
  h1 { font-size: clamp(1.9rem, 3.8vw, 2.6rem); font-weight: 640; }
  h2 { font-size: clamp(1.35rem, 2.5vw, 1.7rem); font-weight: 620; }
  h3 { font-size: 1.02rem; font-weight: 600; }
  p { margin: 0; }
  .lede { color: var(--ink-2); font-size: 1.05rem; max-width: 62ch; }
  .eyebrow {
    font-size: 12px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--accent); font-weight: 620; margin-bottom: 14px;
  }
  .tag {
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    white-space: nowrap;
  }
  .tag-muted { background: transparent; color: var(--ink-3); border: 1px solid var(--line-strong); }

  .hero { padding: 80px 0 64px; border-top: 0; }
  .hero .lede { margin-top: 20px; }
  .hero .tag { display: inline-block; margin-bottom: 18px; }

  .note {
    margin-top: 28px; padding: 18px 20px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    color: var(--ink-2); font-size: 15px; max-width: 62ch;
  }
  .note strong { color: var(--ink); font-weight: 600; }

  .body-copy { color: var(--ink-2); max-width: 62ch; margin-top: 16px; }
  .body-copy + .body-copy { margin-top: 14px; }

  dl.facts { display: grid; grid-template-columns: 170px 1fr; gap: 12px 24px; margin: 28px 0 0; font-size: 15px; }
  dl.facts dt { color: var(--ink-3); }
  dl.facts dd { margin: 0; color: var(--ink-2); }
  @media (max-width: 620px) {
    dl.facts { grid-template-columns: 1fr; gap: 2px 0; }
    dl.facts dd { margin-bottom: 12px; }
  }

  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 32px 0 0; }
  ol.steps > li { counter-increment: step; position: relative; padding-left: 44px; margin-bottom: 30px; }
  ol.steps > li::before {
    content: counter(step);
    position: absolute; left: 0; top: 1px;
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 14px; font-weight: 650;
    display: flex; align-items: center; justify-content: center;
  }
  ol.steps p { color: var(--ink-2); font-size: 15px; margin-top: 6px; max-width: 58ch; }

  /* 코드는 페이지가 아니라 자기 상자 안에서 가로 스크롤한다 — 긴 curl 한 줄 때문에
     본문 전체가 옆으로 밀리면 모바일에서 글이 읽히지 않는다. */
  pre {
    margin: 12px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.6;
  }
  pre, code { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace; }
  pre code { color: var(--ink); }
  p code, li code, dd code {
    font-size: 13.5px; padding: 1px 5px; border-radius: 5px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  }

  ul.plain { margin: 16px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; max-width: 62ch; }
  ul.plain li { margin-bottom: 8px; }

  .contact { display: grid; grid-template-columns: 180px 1fr; gap: 14px 24px; margin-top: 28px; font-size: 15px; }
  .contact dt { color: var(--ink-3); }
  .contact dd { margin: 0; color: var(--ink-2); }
  .contact a { color: var(--accent); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  @media (max-width: 560px) { .contact { grid-template-columns: 1fr; gap: 4px 0; } .contact dd { margin-bottom: 12px; } }

  footer {
    border-top: 1px solid var(--line);
    padding: 32px 0 48px;
    color: var(--ink-3); font-size: 14px;
    display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between;
  }
  footer a { color: var(--ink-3); }
  /* 전자상거래법 표시 의무 항목 — 한 줄로, 나머지 푸터 아래에 전체 너비로 */
  footer .legal { flex-basis: 100%; margin: 0; font-size: 13px; }
</style>
</head>
<body>
<main class="wrap" style="padding:96px 24px">
  <p class="eyebrow">PR Brief</p>
  <h1>PR Brief 는 운영을 마쳤습니다.</h1>
  <p class="lede" style="margin-top:20px">
    2026년 11월, PR Brief 는 새 가입과 개발을 멈췄습니다. 같은 일을 하는 무료 도구가 이미 있어서,
    더 필요한 곳에 시간을 쓰기로 했습니다. 계정이나 데이터 삭제, 문의는 아래 메일로 보내 주세요.
  </p>
  <p style="margin-top:24px"><a href="mailto:etudes0803@gmail.com">etudes0803@gmail.com</a> · <a href="/">다른 제품 보기</a></p>
</main>
</body>
</html>
